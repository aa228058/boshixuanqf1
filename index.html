<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Palmagine Web App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 这个文件是应用的入口。在聊天中向 AI 下达指令后，
       AI 会编辑这个文件 (和 style.css / main.js) 来构建应用。 -->
  <main class="container">
    <h1>Hello, Palmagine!</h1>
    <p>在聊天标签页告诉 AI 你想做的东西吧</p>
    <button id="counter" type="button">点击: 0</button>
  </main>
  <script src="main.js"></script>
</body>
</html>
