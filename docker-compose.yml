services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg-sender-app
    deploy:
      resources:
        limits:
          cpus: '2.5'
          memory: 2.5G
    env_file:
      - .env
    environment:
      - SERVER_PORT=8080
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8081}
      - SERVER_HOST=0.0.0.0
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-tg_sender}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - DB_MAX_CONNS=20
      - DB_MAX_IDLE=5
      - JWT_SECRET=${JWT_SECRET}
      - TG_API_ID=${TG_API_ID}
      - TG_API_HASH=${TG_API_HASH}
      - ENV=${ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    # 审计P1-12: 容器内监听8080, 映射到宿主8081(与应用实际端口一致)
    ports:
      - "8081:8080"
    # R170: 数据目录挂载到宿主机 —— 头像等文件原存在容器内, 每次重建即丢失(前端 404 的根)
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # R164: 日志轮转 —— 默认 json-file 无限制, 日志风暴会写满磁盘导致 postgres 崩溃
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - tg-sender

  postgres:
    image: postgres:16-alpine
    container_name: tg-sender-postgres
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME:-tg_sender}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_MAX_CONNECTIONS=50
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 不映射宿主机端口：数据库仅在内网供 app 访问，避免对外暴露
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-tg_sender}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # R164: 日志轮转 —— 默认 json-file 无限制, 日志风暴会写满磁盘导致 postgres 崩溃
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - tg-sender
    command: >
      postgres
      -c max_connections=50
      -c statement_timeout=30000
      -c idle_in_transaction_session_timeout=60000
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB

  nginx:
    image: nginx:alpine
    container_name: tg-sender-nginx
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # 前端构建产物挂载——此前缺失，stock nginx 只能 serve 默认欢迎页
      - ./web/dist:/usr/share/nginx/html:ro
    depends_on:
      - app
    restart: unless-stopped
    # R164: 日志轮转 —— 默认 json-file 无限制, 日志风暴会写满磁盘导致 postgres 崩溃
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - tg-sender

volumes:
  pgdata:
    driver: local

networks:
  tg-sender:
    driver: bridge
