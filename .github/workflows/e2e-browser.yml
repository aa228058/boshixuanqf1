name: Browser UI audit

on:
  pull_request:
    paths:
      - 'web/**'
      - 'cmd/**'
      - 'internal/**'
      - 'migrations/**'
      - '.github/workflows/e2e-browser.yml'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Optional external target URL (skips isolated backend provisioning)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tg_sender_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: e2e-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tg_sender_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: e2e-postgres-password
          DB_NAME: tg_sender_e2e
          DB_SSLMODE: disable
          JWT_SECRET: 'e2e-only-random-secret-7d8c9a1b2e4f6a8c0d3e5f7b9a1c4d6e'
          TG_API_ID: '12345'
          TG_API_HASH: '0123456789abcdef0123456789abcdef'
          ENV: development
        run: go build -o /tmp/tg-sender-e2e-bin ./cmd/server
      - name: Start isolated API and wait for migrations
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: e2e-postgres-password
          DB_NAME: tg_sender_e2e
          DB_SSLMODE: disable
          SERVER_HOST: 127.0.0.1
          SERVER_PORT: 8080
          JWT_SECRET: 'e2e-only-random-secret-7d8c9a1b2e4f6a8c0d3e5f7b9a1c4d6e'
          TG_API_ID: '12345'
          TG_API_HASH: '0123456789abcdef0123456789abcdef'
          ENV: development
          LOG_LEVEL: warn
        run: |
          mkdir -p /tmp/tg-sender-e2e-runtime
          /tmp/tg-sender-e2e-bin > /tmp/tg-sender-e2e-runtime/server.log 2>&1 &
          echo $! > /tmp/tg-sender-e2e-runtime/server.pid
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:8080/health >/dev/null; then
              echo "API ready; migrations and startup seeding completed."
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/tg-sender-e2e-runtime/server.pid)" 2>/dev/null; then
              cat /tmp/tg-sender-e2e-runtime/server.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/tg-sender-e2e-runtime/server.log
          echo "API did not become healthy in time."
          exit 1
      - name: Create isolated enterprise tenant
        if: ${{ !inputs.base_url }}
        env:
          PGPASSWORD: e2e-postgres-password
        run: |
          set -euo pipefail
          # 只修改本次 CI 的临时数据库，不触碰任何线上套餐或租户。
          # Enterprise 的功能集合取当前套餐矩阵、历史兼容 key 与独立功能开关的并集，
          # 确保前端视觉验收不会因测试租户套餐缺少某个功能而被路由守卫拦截。
          psql -h 127.0.0.1 -U postgres -d tg_sender_e2e -v ON_ERROR_STOP=1 <<'SQL'
          UPDATE plans
          SET features = '["broadcast","loop_broadcast","scrape_members","scrape_links","join_groups","monitor","export","templates","scheduled_tasks","discover","search","proxy","invite","verifier","ai_verify","checkup","dict","api","raffle","notify"]'::jsonb,
              can_broadcast = TRUE,
              can_scrape_members = TRUE,
              can_scrape_links = TRUE,
              can_join_groups = TRUE,
              can_monitor = TRUE,
              can_export = TRUE,
              can_use_templates = TRUE,
              max_monitor_rules = 999,
              max_daily_broadcasts = 0,
              max_daily_scrapes = 999999
          WHERE plan_id = 'enterprise';
          SQL
          FEATURE_COUNT="$(psql -h 127.0.0.1 -U postgres -d tg_sender_e2e -Atc "SELECT jsonb_array_length(features) FROM plans WHERE plan_id = 'enterprise'")"
          test "$FEATURE_COUNT" -eq 20
          psql -h 127.0.0.1 -U postgres -d tg_sender_e2e -v ON_ERROR_STOP=1 <<'SQL'
          SQL
          CODE="$(openssl rand -hex 16)"
          USERNAME="e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PASSWORD="$(openssl rand -hex 20)"
          psql -h 127.0.0.1 -U postgres -d tg_sender_e2e -v ON_ERROR_STOP=1 \
            -v activation_code="$CODE" <<'SQL'
          INSERT INTO activation_codes (code, plan_id, status, timing_type, notes)
          VALUES (:'activation_code', 'enterprise', 'unused', 'on_use', 'Ephemeral GitHub Actions E2E tenant');
          SQL
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg username "$USERNAME" --arg password "$PASSWORD" --arg code "$CODE" '{username:$username,password:$password,name:"Playwright Enterprise",code:$code}')" \
            http://127.0.0.1:8080/api/v1/auth/register
          echo "E2E_TENANT_USERNAME=$USERNAME" >> "$GITHUB_ENV"
          echo "E2E_TENANT_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          LOGIN="$(curl --fail-with-body --silent --show-error -H 'Content-Type: application/json' \
            -d "$(jq -n --arg username "$USERNAME" --arg password "$PASSWORD" '{username:$username,password:$password}')" \
            http://127.0.0.1:8080/api/v1/auth/login)"
          echo "$LOGIN" | jq -e '(.data.plan_id // .plan_id) == "enterprise"' >/dev/null
          echo "$LOGIN" | jq -e '(.data.max_accounts // .max_accounts) == 100' >/dev/null
          echo "$LOGIN" | jq -e '(.data.max_concurrent_tasks // .max_concurrent_tasks) == 40' >/dev/null
          echo "$LOGIN" | jq -e '((.data.plan_features // .plan_features) | keys | length) >= 20' >/dev/null
          for FEATURE in broadcast loop_broadcast scrape_members scrape_links join_groups monitor export templates scheduled_tasks discover search proxy invite verifier ai_verify checkup dict api raffle notify; do
            echo "$LOGIN" | jq -e --arg feature "$FEATURE" '(.data.plan_features // .plan_features)[$feature] == true' >/dev/null
          done
          echo "Enterprise E2E plan, quotas, and all 20 feature permissions verified."
      - name: Install frontend dependencies and run checks
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build

      - name: Configure same-origin frontend and API proxy
        if: ${{ !inputs.base_url }}
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
          # GitHub-hosted runners keep the workspace under /home/runner, which is
          # not necessarily traversable by nginx's www-data worker. Serve a
          # readable copy from /tmp instead of exposing the private workspace.
          sudo rm -rf /tmp/tg-sender-e2e-web
          sudo mkdir -p /tmp/tg-sender-e2e-web
          sudo cp -a web/dist/. /tmp/tg-sender-e2e-web/
          sudo chmod -R a+rX /tmp/tg-sender-e2e-web
          sudo tee /etc/nginx/sites-available/default >/dev/null <<NGINX
          server {
            listen 4173;
            server_name _;
            root /tmp/tg-sender-e2e-web;
            index index.html;
            location /api/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host \$host; }
            location / { try_files \$uri \$uri/ /index.html; }
          }
          NGINX
          sudo nginx -t
          sudo systemctl restart nginx
          # Fail here with actionable diagnostics if nginx cannot read the SPA.
          curl --fail --silent --show-error http://127.0.0.1:4173/login -o /tmp/tg-sender-e2e-runtime/login.html
          grep -q '<div id="app"></div>' /tmp/tg-sender-e2e-runtime/login.html
          ASSET="$(grep -oE 'src="/assets/[^"]+' /tmp/tg-sender-e2e-runtime/login.html | head -1 | cut -d '"' -f 2)"
          test -n "$ASSET"
          curl --fail --silent --show-error "http://127.0.0.1:4173$ASSET" -o /dev/null
          echo "Nginx serves the SPA shell and its built JavaScript bundle."
      - name: Install Playwright
        working-directory: web/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run browser audit
        working-directory: web/e2e
        env:
          BASE_URL: ${{ inputs.base_url || 'http://127.0.0.1:4173' }}
          E2E_SKIP_WEBSERVER: '1'
        run: npm test
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tg-sender-playwright-report
          path: |
            web/e2e/playwright-report/
            web/e2e/test-results/
            /tmp/tg-sender-e2e-runtime/server.log
          if-no-files-found: ignore
          retention-days: 14
