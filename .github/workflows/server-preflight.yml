name: Server Preflight (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-preflight
  cancel-in-progress: false

jobs:
  inspect-server:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Read-only server inventory
        shell: bash
        run: |
          set +e
          echo "===== HOST ====="
          hostname
          id
          . /etc/os-release 2>/dev/null && echo "$PRETTY_NAME"
          uname -m
          echo
          echo "===== RESOURCES ====="
          df -h /
          free -h
          echo
          echo "===== DOCKER CLIENT AND SOCKET PERMISSIONS ====="
          docker --version 2>&1
          docker compose version 2>&1
          if [ -S /var/run/docker.sock ]; then
            stat -c 'docker.sock: mode=%a owner=%U group=%G' /var/run/docker.sock
            namei -l /var/run/docker.sock 2>&1
          else
            echo "Docker socket not found at /var/run/docker.sock"
          fi
          echo "--- current non-interactive sudo permissions ---"
          sudo -n -l 2>&1
          echo "--- docker access test (no changes) ---"
          docker info --format 'Docker server: {{.ServerVersion}}' 2>&1
          echo
          echo "===== ACTUAL DEPLOYMENT DIRECTORY: /www/tg-sender ====="
          for path in /www /www/tg-sender /www/tg-sender/deploy /www/tg-sender/deploy/compose.yaml /www/tg-sender/.env; do
            if [ -e "$path" ]; then
              stat -c '%A %a %U:%G %n' "$path" 2>&1
            else
              printf 'not accessible or absent: %s\n' "$path"
            fi
          done
          echo "--- deployment file names only (no file contents) ---"
          if [ -d /www/tg-sender ]; then
            echo "--- project top-level entries ---"
            ls -la /www/tg-sender 2>&1
            echo "--- compose and env paths/permissions only; never read env contents ---"
            find /www/tg-sender -maxdepth 5 -type f \( -name docker-compose.yml -o -name compose.yaml -o -name compose.yml -o -name .env \) -exec stat -c '%A %a %U:%G %n' {} \; 2>&1
            echo "--- git directory locations ---"
            find /www/tg-sender -maxdepth 4 -type d -name .git -print 2>&1
            echo "--- backup/data directory locations ---"
            find /www/tg-sender -maxdepth 4 -type d \( -name backups -o -name pgdata \) -print 2>&1
          else
            echo "/www/tg-sender does not exist or is not accessible"
          fi
          echo

          echo
          echo "===== LISTENING PORTS ====="
          if command -v ss >/dev/null 2>&1; then ss -lnt 2>&1; else echo "ss not installed"; fi
          echo
          echo "===== OTHER COMPOSE FILE LOCATIONS (PATHS ONLY) ====="
          for base in /srv /var/www /home /root; do
            if [ -d "$base" ]; then
              find "$base" -maxdepth 4 -type f \( -name docker-compose.yml -o -name compose.yaml -o -name compose.yml \) -print 2>/dev/null
            fi
          done
          echo
          echo "===== END OF READ-ONLY CHECK ====="
