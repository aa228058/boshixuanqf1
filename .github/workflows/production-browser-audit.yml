name: Production Read-only Browser Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'web/e2e/**'
      - '.github/workflows/production-browser-audit.yml'

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright test runner without changing the lockfile
        working-directory: web
        run: npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test
      - name: Install Chromium
        run: npx --prefix web playwright install --with-deps chromium
      - name: Validate Playwright configuration and test discovery
        working-directory: web
        env:
          E2E_PRODUCTION_AUDIT: '1'
          E2E_TENANT_USERNAME: validation-placeholder
          E2E_TENANT_PASSWORD: validation-placeholder
          BASE_URL: https://boshixuan.duckdns.org
          E2E_SKIP_WEBSERVER: '1'
        run: npx playwright test -c e2e/playwright.config.ts --list

  production-audit:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Require dedicated test account secrets
        env:
          E2E_TENANT_USERNAME: ${{ secrets.E2E_TENANT_USERNAME }}
          E2E_TENANT_PASSWORD: ${{ secrets.E2E_TENANT_PASSWORD }}
        run: |
          test -n "$E2E_TENANT_USERNAME" || (echo "Missing repository secret E2E_TENANT_USERNAME"; exit 1)
          test -n "$E2E_TENANT_PASSWORD" || (echo "Missing repository secret E2E_TENANT_PASSWORD"; exit 1)
      - name: Install Playwright test runner without changing the lockfile
        working-directory: web
        run: npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test
      - name: Install Chromium
        run: npx --prefix web playwright install --with-deps chromium
      - name: Audit live production pages on desktop and iPhone-sized browser
        working-directory: web
        env:
          E2E_PRODUCTION_AUDIT: '1'
          E2E_TENANT_USERNAME: ${{ secrets.E2E_TENANT_USERNAME }}
          E2E_TENANT_PASSWORD: ${{ secrets.E2E_TENANT_PASSWORD }}
          E2E_ACCOUNT_ID: ${{ secrets.E2E_ACCOUNT_ID }}
          BASE_URL: https://boshixuan.duckdns.org
          E2E_SKIP_WEBSERVER: '1'
        run: npx playwright test -c e2e/playwright.config.ts --project=production-desktop --project=production-mobile
      - name: Upload screenshots and Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-audit-${{ github.run_number }}
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: warn
          retention-days: 14
