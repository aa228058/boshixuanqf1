name: CI

on:
  push:
    branches:
      - main
      - master
      - ci/isolated-enterprise-e2e
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - master
      - feat/group-import-resolver-pipeline

jobs:
  sql-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SQL coverage scan
        run: python3 scripts/check-sql-coverage.py

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - name: Run repository integration tests (PostgreSQL 16 via testcontainers)
        run: go test -tags=integration -timeout 600s ./internal/repository/

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: ./web
        run: npm install --no-audit --no-fund
      - name: Design token guard
        working-directory: ./web
        run: npm run check:design-tokens
      - name: Typecheck
        working-directory: ./web
        run: npm run typecheck
      - name: Run frontend tests
        working-directory: ./web
        run: npm test
      - name: Build
        working-directory: ./web
        run: npm run build

  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tg_sender_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - name: Download dependencies
        run: go mod download
      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l internal/ cmd/)
          if [ -n "$UNFORMATTED" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$UNFORMATTED"
            gofmt -d $UNFORMATTED
            exit 1
          fi
      - name: Run go vet
        run: go vet ./...
      - name: Run gosec
        id: gosec
        continue-on-error: true
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude-generated ./...
      - name: Run Go tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: tg_sender_test
          DB_SSLMODE: disable
          JWT_SECRET: test-secret-key-32-char-long!!! # gitleaks:allow test fixture
          TG_API_ID: 12345
          TG_API_HASH: test_hash
        run: go test -race -coverprofile=coverage.out ./...
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false
      - name: Build binary
        run: go build -o tg-sender ./cmd/server
      - name: Apply all database migrations
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          goose -dir migrations postgres "postgres://postgres:postgres@localhost:5432/tg_sender_test?sslmode=disable" up
      - name: Run group import worker PostgreSQL integration suite
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: tg_sender_test
          DB_SSLMODE: disable
        run: go test -race -tags=importworker -timeout 300s ./internal/domain/grouplib -run '^TestImportWorker' -count=1 -v
      - name: Benchmark group import parser (10k/30k/50k)
        env:
          GOMAXPROCS: 2
        run: |
          set -o pipefail
          go test ./internal/domain/grouplib -run '^$' -bench '^BenchmarkFilterImportLinks$' -benchmem -benchtime=1x -count=1 | tee import-filter-bench.txt
      - name: Benchmark PostgreSQL failure batch persistence (10k/30k/50k)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: tg_sender_test
          DB_SSLMODE: disable
        run: |
          set -o pipefail
          go test -tags=importbench ./internal/domain/grouplib -run '^TestPersistImportFailuresLoad$' -v -count=1 2>&1 | tee -a import-filter-bench.txt
      - name: Upload import benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: group-import-parser-and-postgres-benchmark
          path: import-filter-bench.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Enforce gosec result
        if: always() && steps.gosec.outcome == 'failure'
        run: |
          echo "gosec reported security findings; review the Run gosec step before merging."
          exit 1
